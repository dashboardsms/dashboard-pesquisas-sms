name: Sincronizar planilha do Google Sheets

on:
  schedule:
    # A cada 5 minutos, o menor intervalo do GitHub. Em horários de pico, a execução atrasa.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Uma execução por vez; a seguinte espera a anterior terminar.
concurrency:
  group: sincronizar-planilha
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version

      # Sem npm install: o script usa só o Node e o código de frontend/src/planilha.
      # URL_PLANILHA e SENHA_IMPORTACAO são secrets do repositório; API_URL é a mesma
      # variável usada no deploy do GitHub Pages (Settings → Secrets and variables → Actions).
      - name: Sincronizar
        run: node src/sincronizar.js
        env:
          URL_PLANILHA: ${{ secrets.URL_PLANILHA }}
          SENHA_IMPORTACAO: ${{ secrets.SENHA_IMPORTACAO }}
          API_URL: ${{ vars.API_URL }}
